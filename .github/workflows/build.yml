name: Build

# push / PR 只做检查 + 出安装包；打 v* tag 时额外创建 GitHub Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22"
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端检查（typecheck + 静态构建）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # package-lock.json 已入库；仓库不含 .npmrc（里面是机器相关的代理设置）
      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 静态构建（nuxt generate）
        run: npm run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: web-static
          path: .output/public
          retention-days: 7

  desktop:
    name: Windows 安装包
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # windows-latest 自带 MSVC 生成工具与 Windows SDK，只需装 Rust 工具链
      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 安装依赖
        run: npm ci

      # 仓库里的 src-tauri/.cargo/config.toml 指向 USTC 稀疏镜像（为本机网络准备），
      # runner 能直连 crates.io，构建前挪开以免走慢镜像。
      - name: 使用官方 crates.io
        shell: pwsh
        run: |
          if (Test-Path src-tauri/.cargo/config.toml) {
            Move-Item src-tauri/.cargo/config.toml src-tauri/.cargo/config.toml.mirror
          }

      # 非 tag 构建：只产出安装包；tag 构建：顺带创建 Release 并附上产物
      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false

      # tauri-action 只把 bundle 里的 NSIS 安装包挂到 Release，便携版 exe 需单独上传
      - name: 上传便携版到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $dst = "Arknights.Gacha_${ver}_x64-portable.exe"
          Copy-Item "src-tauri/target/release/arknights-gacha.exe" $dst
          gh release upload "${{ github.ref_name }}" $dst --clobber

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/arknights-gacha.exe
          if-no-files-found: error
          retention-days: 14
