[package]
name = "arknights-gacha"
version = "1.0.0"
description = "明日方舟寻访记录同步与统计"
authors = ["Arknights Gacha"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "arknights_gacha_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "gzip", "rustls-tls"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
